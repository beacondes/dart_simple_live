name: Build VR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'vr/**'
      - '.github/workflows/build-vr.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clone OpenXR SDK
        run: |
          git clone --depth 1 --branch release-1.0.34 https://github.com/KhronosGroup/OpenXR-SDK-Source.git vr/third_party/OpenXR-SDK-Source

      - name: Build APK
        working-directory: vr
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: vr
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simplelive-vr-apk
          path: vr/app/build/outputs/apk/release/app-release.apk
